<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>
    <link rel="icon" type="image/png" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="css/style.css">



</head>
<body class="bg-light">
    <nav class="bg-green-600 shadow-lg">

    <div class="w-full px-6 py-4 flex justify-between items-center">

        <!-- Logo -->
        <a href="index.html" class="text-white text-2xl font-bold">
            🎓 Student Management
        </a>

        <!-- Dashboard Button -->
        <a href="index.html"
           class="bg-white text-green-600 px-4 py-2 rounded-lg font-medium hover:bg-gray-100 transition duration-200">
            Dashboard
        </a>

    </div>

</nav>
    <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Breadcrumb -->

    <nav class="flex items-center text-sm text-gray-500 mb-6">

        <a href="index.html"
           class="hover:text-green-600 transition">
            Dashboard
        </a>

        <span class="mx-2">/</span>

        <a href="#"
           class="hover:text-green-600 transition">
            Students
        </a>

        <span class="mx-2">/</span>

        <span class="font-medium text-gray-700">
            Add Student
        </span>

    </nav>

    <!-- Page Heading -->

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-gray-800 flex items-center">

            <span class="mr-3">➕</span>

            Add Student

        </h1>

        <p class="text-gray-500 mt-2">

            Fill in the details below to add a new student.

        </p>

    </div>
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">

    <!-- Card Header -->

    <div class="bg-green-600 text-white px-6 py-4">

        <h2 class="text-xl font-semibold flex items-center">

            <span class="mr-3">🎓</span>

            Student Information

        </h2>

    </div>

        <div class="p-6">
                <!-- Success Alert -->
    <div class="mb-6 rounded-lg bg-green-100 border border-green-400 text-green-700 px-4 py-3">
        ✅ Student Saved Successfully
    </div>

    <form>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- First Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    👤 First Name <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    placeholder="Enter first name"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Last Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    👤 Last Name <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    placeholder="Enter last name"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    📧 Email <span class="text-red-500">*</span>
                </label>
                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    📞 Phone Number <span class="text-red-500">*</span>
                </label>
                <input
                    type="tel"
                    placeholder="Enter your Phone Number"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Roll Number -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    #️⃣ Roll Number <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    placeholder="Enter your Roll Number"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Registration Number -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    🆔 Registration Number <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    placeholder="Enter your Registration Number"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Gender -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">
                    ⚧ Gender
                </label>

                <div class="space-y-2">

                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" class="text-green-600">
                        Male
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" class="text-green-600">
                        Female
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" class="text-green-600">
                        Others
                    </label>

                </div>

            </div>

            <!-- Date of Birth -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    📅 Date of Birth
                </label>

                <input
                    type="date"
                    name="DateofBirth"
                    id="dob"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Semester -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    📚 Semester
                </label>

                <input
                    type="number"
                    placeholder="Enter your current semester"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Department -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    🏢 Department
                </label>

                <input
                    type="text"
                    placeholder="Enter your Department"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- City -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    📍 City
                </label>

                <select
                    id="city"
                    name="city"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-500">

                    <option value="" selected disabled>Select City</option>
                    <option value="Islamabad">Islamabad</option>
                    <option value="Lahore">Lahore</option>
                    <option value="Faisalabad">Faisalabad</option>
                    <option value="Multan">Multan</option>

                </select>

            </div>

            <!-- Country -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    🌍 Country
                </label>

                <input
                    type="text"
                    placeholder="Enter your Country"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

        </div>

        <!-- Address -->
        <div class="mt-6">

            <label class="block text-sm font-medium text-gray-700 mb-2">
                🏠 Address
            </label>

            <input
                type="text"
                name="Address"
                id="Address"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">

        </div>

        <!-- Buttons -->
        <div class="flex justify-between mt-8">

            <button
                type="submit"
                class="bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700 transition">

                Save Student

            </button>

            <button
                type="reset"
                class="bg-yellow-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-yellow-600 transition">

                Reset

            </button>

        </div>

    </form>

</div>
        </div>









    </div>




    </body>
</html>
