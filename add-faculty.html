<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Faculty | University Portal</title>
    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-green-600 text-white px-6 py-4 shadow-md">
        <div class="flex justify-between items-center">

            <h1 class="text-xl font-bold">
                University Portal
            </h1>

            <a href="dashboard.html"
               class="bg-white text-green-600 px-4 py-2 rounded-lg hover:bg-gray-100">
                Dashboard
            </a>

        </div>
    </nav>


    <main class="max-w-6xl mx-auto px-6 py-8">

        <!-- Breadcrumb -->
        <div class="mb-6 text-sm text-gray-500">
            <a href="dashboard.html" class="hover:text-green-600">
                Dashboard
            </a>
            /
            <span class="text-gray-700">
                Faculty
            </span>
            /
            <span class="text-gray-700">
                Add Faculty
            </span>
        </div>


        <!-- Page Heading -->
        <div class="mb-8">

            <h2 class="text-3xl font-bold text-gray-800">
                Add Faculty
            </h2>

            <p class="text-gray-500 mt-2">
                Add a new faculty member to the university system.
            </p>

        </div>


        <!-- Toast -->
        <div
    id="toast"
    class="hidden fixed z-50 top-5 right-5 bg-green-600 text-white px-6 py-4 rounded-lg shadow-xl">
    <span id="toastMessage">
    Faculty Added Successfully!
    </span>
    </div>


        <!-- Form Card -->
        <div class="bg-white rounded-xl shadow-lg p-8">

            <form id="facultyForm">

                <!-- Personal Information -->
                <h3 class="text-xl font-semibold text-gray-700 mb-6">
                    Personal Information
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Faculty ID -->
                    <div>
                        <label for="facultyId"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Faculty ID <span class="text-red-500">*</span>
                        </label>

                        <input
                            type="text"
                            id="facultyId"
                            name="facultyId"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                            placeholder="e.g. FAC-001">
                    </div>


                    <!-- First Name -->
                    <div>
                        <label for="firstName"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            First Name <span class="text-red-500">*</span>
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>


                    <!-- Last Name -->
                    <div>
                        <label for="lastName"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Last Name <span class="text-red-500">*</span>
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>


                    <!-- Email -->
                    <div>
                        <label for="email"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Email <span class="text-red-500">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>


                    <!-- Phone -->
                    <div>
                        <label for="phoneNumber"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Phone Number <span class="text-red-500">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phoneNumber"
                            name="phoneNumber"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                            placeholder="03XXXXXXXXX">
                    </div>


                    <!-- Date of Birth -->
                    <div>
                        <label for="dob"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>


                    <!-- Gender -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">
                            Gender
                        </label>

                        <div class="flex gap-6">

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male"
                                    class="accent-green-600">
                                Male
                            </label>

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female"
                                    class="accent-green-600">
                                Female
                            </label>

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Other"
                                    class="accent-green-600">
                                Other
                            </label>

                        </div>
                    </div>

                </div>


                <!-- Professional Information -->
                <h3 class="text-xl font-semibold text-gray-700 mt-10 mb-6">
                    Professional Information
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Department -->
                    <div>
                        <label for="department"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Department <span class="text-red-500">*</span>
                        </label>

                        <select
                            id="department"
                            name="department"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">

                            <option value="">
                                Select Department
                            </option>

                            <option value="Computer Science">
                                Computer Science
                            </option>

                            <option value="Software Engineering">
                                Software Engineering
                            </option>

                            <option value="Electrical Engineering">
                                Electrical Engineering
                            </option>

                            <option value="Business Administration">
                                Business Administration
                            </option>

                            <option value="Mathematics">
                                Mathematics
                            </option>

                        </select>
                    </div>


                    <!-- Designation -->
                    <div>
                        <label for="designation"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Designation <span class="text-red-500">*</span>
                        </label>

                        <select
                            id="designation"
                            name="designation"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">

                            <option value="">
                                Select Designation
                            </option>

                            <option value="Professor">
                                Professor
                            </option>

                            <option value="Associate Professor">
                                Associate Professor
                            </option>

                            <option value="Assistant Professor">
                                Assistant Professor
                            </option>

                            <option value="Lecturer">
                                Lecturer
                            </option>

                            <option value="Teaching Assistant">
                                Teaching Assistant
                            </option>

                        </select>
                    </div>


                    <!-- Joining Date -->
                    <div>
                        <label for="joiningDate"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            id="joiningDate"
                            name="joiningDate"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>


                    <!-- City -->
                    <div>
                        <label for="city"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>


                    <!-- Country -->
                    <div>
                        <label for="country"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Country
                        </label>

                        <select
                            id="country"
                            name="country"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">

                            <option value="">
                                Select Country
                            </option>

                            <option value="Pakistan">
                                Pakistan
                            </option>

                            <option value="United States">
                                United States
                            </option>

                            <option value="United Kingdom">
                                United Kingdom
                            </option>

                            <option value="Canada">
                                Canada
                            </option>

                            <option value="Australia">
                                Australia
                            </option>

                        </select>
                    </div>

                </div>


                <!-- Address -->
                <div class="mt-6">

                    <label for="address"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>

                </div>


                <!-- Buttons -->
                <div class="flex justify-between mt-10">

                    <button
                        type="reset"
                        class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600">
                        Reset
                    </button>

                    <button
                        type="button"
                        id="saveFacultyBtn"
                        class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">
                        Save Faculty
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/add-faculty.js"></script>

</body>

</html>
