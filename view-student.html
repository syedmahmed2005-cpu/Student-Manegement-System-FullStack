<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <title>View Student</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="css/output.css">

</head>
<body class="bg-slate-50">
    <main class="p-5">
       
        <div class="bg-linear-to-r from-green-700 to-green-500 rounded-2xl shadow-lg p-8 text-white mb-8">

    <div class="flex justify-between items-center">

        <div>

            <h1 class="text-4xl font-bold">
                👨‍🎓 View Students
            </h1>

            <p class="mt-2 text-green-100">
                Manage all registered students in the system.
            </p>

        </div>

        <a href="add-student.html"
           class="bg-white text-green-700 font-semibold px-6 py-3 rounded-lg hover:bg-gray-100 transition">

            + Add Student

        </a>

    </div>

</div>


    <div class="bg-white rounded-xl shadow-lg p-6 mt-5">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
    <label for="search" class=" text-sm font-medium text-gray-700 mb-2">
        Search Students
    </label>

    <input
        id="search"
        type="text"
        placeholder="Search students..."
        class="w-full border border-gray-300 rounded-[15px] px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
    >
    </div>
    <div>
    <label for="semesterFilter" class="text-sm font-medium text-gray-700 mb-5">
        Semester
    </label>
    <select id="semesterFilter"
    class="w-full border border-gray-300 rounded-[15px] px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
    <option value="">All Semesters</option>
    <option value="1">First</option>
    <option value="2">Second</option>
    <option value="3">Third</option>
    <option value="4">Fourth</option>
    <option value="5">Fifth</option>
    <option value="6">Sixth</option>
    <option value="7">Seventh</option>
    <option value="8">Eighth</option>
    </select>
    </div>
    </div>

    </div>



    <div class="bg-white rounded-xl shadow-lg mt-8 overflow-hidden">
        <div class=" text-gray-900 px-6 py-4">
            <h2 class="text-xl font-semibold">
                Student Records
            </h2>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-green-600 text-white">
                    <tr>
                        <th class="px-6 py-3 text-left">Student</th>
                        <th class="px-6 py-3 text-left">Roll No</th>
                        <th class="px-6 py-3 text-left">Semester</th>
                        <th class="px-6 py-3 text-left">Department</th>
                        <th class="px-6 py-3 text-left">Status</th>
                        <th class="px-6 py-3 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    
                </tbody>
            </table>
            <div class="bg-white rounded-xl shadow-lg mt-6 p-6">
                <div class="flex justify-between items-center">
                    <div class="text-gray-500 font-medium">
                        Showing 1-10 of 100 students
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-green-100 transition">
                            Previous
                        </button>
                        <button class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                            1
                        </button>

                        <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-green-100 transition">
                            2
                        </button>

                        <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-green-100 transition">
                            3
                        </button>

                        <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-green-100 transition">
                            Next
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>


<!-- Delete Confirmation Modal -->
<div id="deleteModal"
     class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">

    <div class="bg-white rounded-2xl shadow-xl w-[400px] p-6">

        <h2 class="text-xl font-bold mb-3">
            Delete Student
        </h2>

        <p class="text-gray-600 mb-6">
            Are you sure you want to delete this student?
        </p>

        <div class="flex justify-end gap-3">

            <button
                id="cancelDelete"
                class="px-4 py-2 rounded-lg border border-gray-300">
                Cancel
            </button>

            <button
                id="confirmDelete"
                class="px-4 py-2 rounded-lg bg-red-600 text-white">
                Delete
            </button>

        </div>

    </div>

</div>


 <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
 <script src="js/view-student.js"></script>

</body>
</html>
