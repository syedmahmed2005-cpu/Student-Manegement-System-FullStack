<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Faculty | University Portal</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-green-600 text-white px-6 py-4 shadow-md">
        <div class="flex justify-between items-center">

            <h1 class="text-xl font-bold">
                University Portal
            </h1>

            <a href="dashboard.html"
               class="bg-white text-green-600 px-4 py-2 rounded-lg hover:bg-gray-100">
                Dashboard
            </a>

        </div>
    </nav>


    <main class="max-w-7xl mx-auto px-6 py-8">

        <!-- Breadcrumb -->
        <div class="mb-6 text-sm text-gray-500">

            <a href="dashboard.html"
               class="hover:text-green-600">
                Dashboard
            </a>

            /

            <span class="text-gray-700">
                Faculty
            </span>

        </div>


        <!-- Heading -->
        <div class="flex justify-between items-center mb-8">

            <div>

                <h2 class="text-3xl font-bold text-gray-800">
                    Faculty Members
                </h2>

                <p class="text-gray-500 mt-2">
                    Manage university faculty members.
                </p>

            </div>

            <a href="add-faculty.html"
               class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700">
                + Add Faculty
            </a>

        </div>


        <!-- Search & Filter -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <!-- Search -->
                <div>

                    <label for="search"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Search Faculty
                    </label>

                    <input
                        id="search"
                        type="text"
                        placeholder="Search by name, Faculty ID or email..."
                        class="w-full border border-gray-300 rounded-[15px] px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">

                </div>


                <!-- Department -->
                <div>

                    <label for="Department"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Department
                    </label>

                    <select
                        id="Department"
                        class="w-full border border-gray-300 rounded-[15px] px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">

                        <option value="">
                            All Departments
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Software Engineering">
                            Software Engineering
                        </option>

                        <option value="Electrical Engineering">
                            Electrical Engineering
                        </option>

                        <option value="Business Administration">
                            Business Administration
                        </option>

                        <option value="Mathematics">
                            Mathematics
                        </option>

                    </select>

                </div>

            </div>

        </div>


        <!-- Faculty Table -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">

            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-gray-100 border-b">

                        <tr>

                            <th class="px-6 py-4 font-semibold text-gray-700">
                                Faculty
                            </th>

                            <th class="px-6 py-4 font-semibold text-gray-700">
                                Faculty ID
                            </th>

                            <th class="px-6 py-4 font-semibold text-gray-700">
                                Department
                            </th>

                            <th class="px-6 py-4 font-semibold text-gray-700">
                                Designation
                            </th>

                            <th class="px-6 py-4 font-semibold text-gray-700">
                                Status
                            </th>

                            <th class="px-6 py-4 font-semibold text-gray-700">
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="facultyTableBody">

                        <!-- Faculty rows will be created by JavaScript -->

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <!-- Delete Confirmation Modal -->
    <div id="deleteModal"
         class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

        <div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-md">

            <h3 class="text-xl font-bold text-gray-800 mb-3">
                Delete Faculty
            </h3>

            <p class="text-gray-600 mb-6">
                Are you sure you want to delete this faculty member?
                This action cannot be undone.
            </p>

            <div class="flex justify-end gap-3">

                <button
                    id="cancelDeleteBtn"
                    class="bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600">
                    Cancel
                </button>

                <button
                    id="confirmDeleteBtn"
                    class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">
                    Delete
                </button>

            </div>

        </div>

    </div>


    <!-- Toast -->
    <div id="toast"
         class="hidden fixed top-5 right-5 z-50 px-6 py-3 rounded-lg shadow-lg text-white">
         <span id="toastMessage"></span>
    </div>


    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/view-faculty.js"></script>

</body>

</html>
