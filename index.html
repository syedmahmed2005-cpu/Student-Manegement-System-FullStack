<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
  (function () {
    try {
      var savedTheme =
        localStorage.getItem("educore-theme") || "system";

      var useDarkMode =
        savedTheme === "dark" ||
        (savedTheme === "system" &&
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches);

      document.documentElement.classList.toggle(
        "dark",
        useDarkMode
      );

      document.documentElement.style.colorScheme =
        useDarkMode ? "dark" : "light";
    } catch (error) {
      var systemUsesDarkMode = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      document.documentElement.classList.toggle(
        "dark",
        systemUsesDarkMode
      );

      document.documentElement.style.colorScheme =
        systemUsesDarkMode ? "dark" : "light";
    }
  })();
</script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>student-management-react</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
